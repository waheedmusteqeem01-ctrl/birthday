<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Birthday Hursh ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet" />
    <style>
        /* ── same base styles as before, but adjusted for the 3D canvas ── */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b1a2e;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
        }
        .card {
            max-width: 820px;
            width: 100%;
            background: linear-gradient(145deg, #0d2137, #162f4a);
            border-radius: 48px;
            padding: 30px 30px 40px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.7), 0 0 0 1px rgba(64,164,255,0.15);
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(64,164,255,0.2);
        }
        .card::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(64,164,255,0.06), transparent 60%);
            pointer-events: none;
        }
        .glow-ring {
            position: absolute;
            top: -80px; right: -80px;
            width: 280px; height: 280px;
            background: radial-gradient(circle, rgba(64,164,255,0.15), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(40px);
        }
        .glow-ring-bottom {
            position: absolute;
            bottom: -100px; left: -100px;
            width: 320px; height: 320px;
            background: radial-gradient(circle, rgba(0,180,255,0.10), transparent 70%);
            border-radius: 50%;
            pointer-events: none;
            filter: blur(50px);
        }
        .content {
            position: relative;
            z-index: 2;
            text-align: center;
        }
        .emoji-header {
            font-size: 2.8rem;
            letter-spacing: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            animation: floatEmojis 3s ease-in-out infinite;
        }
        @keyframes floatEmojis {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.8rem;
            font-weight: 400;
            color: #8ac4ff;
            text-shadow: 0 0 30px rgba(64,164,255,0.3), 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 4px;
            letter-spacing: 2px;
        }
        .title span { color: #ffffff; text-shadow: 0 0 40px rgba(100,200,255,0.5); }
        .sub-title {
            font-size: 1.2rem;
            font-weight: 300;
            color: rgba(160,200,255,0.7);
            letter-spacing: 6px;
            text-transform: uppercase;
            margin-bottom: 20px;
            border-top: 1px solid rgba(64,164,255,0.15);
            border-bottom: 1px solid rgba(64,164,255,0.15);
            display: inline-block;
            padding: 8px 24px;
            backdrop-filter: blur(4px);
            background: rgba(11,26,46,0.3);
            border-radius: 60px;
        }
        .name-spotlight {
            font-size: 5.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #6ab7ff, #2b7fff, #6ab7ff);
            background-size: 200% 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmerName 4s ease-in-out infinite;
            line-height: 1.1;
            margin-bottom: 12px;
            letter-spacing: 2px;
            filter: drop-shadow(0 0 30px rgba(64,164,255,0.2));
        }
        @keyframes shimmerName {
            0%,100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        /* ── 3D Cake Container ── */
        .cake-container {
            width: 100%;
            max-width: 400px;
            height: 300px;
            margin: 0 auto 20px;
            border-radius: 30px;
            background: rgba(11,26,46,0.2);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(64,164,255,0.08);
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 50px rgba(64,164,255,0.05);
        }
        #cakeCanvas {
            display: block;
            width: 100%;
            height: 100%;
            cursor: grab;
        }
        #cakeCanvas:active { cursor: grabbing; }

        .message {
            font-size: 1.15rem;
            font-weight: 300;
            color: rgba(200,225,255,0.85);
            max-width: 520px;
            margin: 8px auto 20px;
            line-height: 1.7;
            padding: 0 10px;
            letter-spacing: 0.3px;
        }
        .message .heart {
            color: #ff6b8a;
            display: inline-block;
            animation: pulseHeart 1.6s ease-in-out infinite;
        }
        @keyframes pulseHeart {
            0%,100% { transform: scale(1); }
            50% { transform: scale(1.25); }
        }

        .age-badge {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: rgba(64,164,255,0.10);
            border: 1px solid rgba(64,164,255,0.20);
            padding: 8px 24px 8px 20px;
            border-radius: 60px;
            backdrop-filter: blur(4px);
            margin-bottom: 24px;
            font-size: 0.95rem;
            color: rgba(180,215,255,0.8);
            letter-spacing: 0.5px;
        }
        .age-badge strong {
            font-weight: 700;
            color: #8ac4ff;
            font-size: 1.3rem;
        }
        .age-badge .cake { font-size: 1.6rem; line-height: 1; }

        .actions {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 14px;
            margin: 8px 0 16px;
        }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            background: linear-gradient(135deg, #1a4a7a, #0d2b4a);
            color: #b0d4ff;
            border: 1px solid rgba(64,164,255,0.25);
            box-shadow: 0 4px 20px rgba(0,0,0,0.2);
            flex: 1 1 auto;
            min-width: 160px;
            justify-content: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2b7fff, #1a5bbf);
            color: #fff;
            border-color: rgba(64,164,255,0.5);
            box-shadow: 0 4px 30px rgba(43,127,255,0.25);
        }
        .btn-primary:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 8px 40px rgba(43,127,255,0.35);
            border-color: rgba(64,164,255,0.8);
        }
        .btn-secondary:hover {
            transform: translateY(-3px);
            background: linear-gradient(135deg, #1f5a8a, #123a5a);
            border-color: rgba(64,164,255,0.5);
        }
        .btn .icon { font-size: 1.3rem; line-height: 1; }

        .balloons {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
            margin: 10px 0 6px;
            opacity: 0.6;
        }
        .balloon {
            font-size: 2.6rem;
            animation: swayBalloon 3s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 8px 20px rgba(64,164,255,0.15));
        }
        .balloon:nth-child(2) { animation-delay: 0.6s; }
        .balloon:nth-child(3) { animation-delay: 1.2s; }
        .balloon:nth-child(4) { animation-delay: 0.3s; }
        .balloon:nth-child(5) { animation-delay: 0.9s; }
        @keyframes swayBalloon {
            0%,100% { transform: translateY(0) rotate(-3deg); }
            50% { transform: translateY(-12px) rotate(3deg); }
        }

        .footer {
            margin-top: 24px;
            font-size: 0.85rem;
            color: rgba(100,160,220,0.4);
            letter-spacing: 2px;
            border-top: 1px solid rgba(64,164,255,0.06);
            padding-top: 20px;
            font-weight: 300;
        }
        .footer span { color: rgba(100,160,220,0.6); }

        /* particles (static decorative) */
        .particles {
            position: absolute;
            inset: 0;
            pointer-events: none;
            overflow: hidden;
            z-index: 0;
        }
        .particle {
            position: absolute;
            width: 4px; height: 4px;
            background: rgba(64,164,255,0.25);
            border-radius: 50%;
            animation: floatParticle 12s infinite linear;
        }
        .particle:nth-child(1) { left:10%; top:20%; animation-duration:14s; width:6px; height:6px; }
        .particle:nth-child(2) { left:85%; top:10%; animation-duration:18s; animation-delay:2s; }
        .particle:nth-child(3) { left:20%; top:80%; animation-duration:16s; animation-delay:4s; width:8px; height:8px; }
        .particle:nth-child(4) { left:70%; top:70%; animation-duration:20s; animation-delay:1s; }
        .particle:nth-child(5) { left:50%; top:40%; animation-duration:15s; animation-delay:3s; width:5px; height:5px; }
        .particle:nth-child(6) { left:5%; top:50%; animation-duration:22s; animation-delay:5s; }
        .particle:nth-child(7) { left:92%; top:55%; animation-duration:17s; animation-delay:0.5s; width:7px; height:7px; }
        .particle:nth-child(8) { left:40%; top:90%; animation-duration:19s; animation-delay:6s; }
        @keyframes floatParticle {
            0% { transform: translateY(0) translateX(0) scale(1); opacity:0.2; }
            25% { transform: translateY(-30px) translateX(20px) scale(1.3); opacity:0.6; }
            50% { transform: translateY(-60px) translateX(-10px) scale(0.8); opacity:0.3; }
            75% { transform: translateY(-90px) translateX(30px) scale(1.5); opacity:0.7; }
            100% { transform: translateY(-120px) translateX(0) scale(1); opacity:0.2; }
        }

        @media (max-width: 600px) {
            .card { padding: 20px 16px; border-radius: 32px; }
            .title { font-size: 2.6rem; }
            .name-spotlight { font-size: 3.6rem; }
            .sub-title { font-size: 0.9rem; letter-spacing:4px; padding:6px 18px; }
            .message { font-size: 1rem; }
            .cake-container { height: 240px; max-width: 100%; }
            .btn { padding:12px 22px; font-size:0.9rem; min-width:130px; }
            .emoji-header { font-size:2rem; gap:6px; }
            .balloon { font-size:2rem; }
            .age-badge { font-size:0.8rem; padding:6px 16px; }
        }
        @media (max-width: 400px) {
            .name-spotlight { font-size: 2.8rem; }
            .title { font-size: 2rem; }
            .btn { min-width:100%; }
            .cake-container { height: 200px; }
        }
    </style>
</head>
<body>

<div class="card">

    <div class="particles">
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div><div class="particle"></div>
        <div class="particle"></div><div class="particle"></div>
    </div>

    <div class="glow-ring"></div>
    <div class="glow-ring-bottom"></div>

    <div class="content">

        <div class="emoji-header">
            <span>🎂</span><span>💙</span><span>🎈</span><span>✨</span><span>🎁</span>
        </div>

        <h1 class="title">Happy&nbsp;Birthday</h1>
        <div class="name-spotlight">Hursh</div>
        <div class="sub-title">— today is all about you —</div>

        <!-- 3D Cake Container -->
        <div class="cake-container" id="cakeContainer">
            <canvas id="cakeCanvas"></canvas>
        </div>

        <p class="message">
            To the most incredible boyfriend in the world —<br />
            you make every day brighter just by being you.
            <span class="heart">❤️</span>
        </p>

        <div class="age-badge">
            <span class="cake">🎂</span>
            <span>Celebrating <strong>another</strong> trip around the sun</span>
            <span style="font-size:1.2rem;">🌞</span>
        </div>

        <div class="balloons">
            <span class="balloon">🎈</span>
            <span class="balloon">🎈</span>
            <span class="balloon">🎈</span>
            <span class="balloon">🎈</span>
            <span class="balloon">🎈</span>
        </div>

        <div class="actions">
            <button class="btn btn-primary" id="wishBtn">
                <span class="icon">💙</span> Send Love
            </button>
            <button class="btn btn-secondary" id="surpriseBtn">
                <span class="icon">🎁</span> Surprise
            </button>
        </div>

        <div class="footer">
            <span>✨ made with all my love ✨</span>
        </div>

    </div>
</div>

<!-- Three.js from CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<!-- OrbitControls for interaction -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

<script>
    (function() {
        // ── 3D Cake Setup ──
        const container = document.getElementById('cakeContainer');
        const canvas = document.getElementById('cakeCanvas');
        const width = container.clientWidth;
        const height = container.clientHeight;

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0b1a2e); // match card

        const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
        camera.position.set(3, 2, 5);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
        renderer.setSize(width, height);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;

        // ── Lights ──
        const ambient = new THREE.AmbientLight(0x404060);
        scene.add(ambient);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(2, 5, 3);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const fillLight = new THREE.DirectionalLight(0x6ab7ff, 0.6);
        fillLight.position.set(-2, 1, -2);
        scene.add(fillLight);

        const backLight = new THREE.DirectionalLight(0x4a7fff, 0.5);
        backLight.position.set(0, 1, -4);
        scene.add(backLight);

        // ── Cake Group ──
        const cakeGroup = new THREE.Group();
        scene.add(cakeGroup);

        // ---- Base (plate) ----
        const plateGeo = new THREE.CylinderGeometry(1.6, 1.6, 0.15, 32);
        const plateMat = new THREE.MeshStandardMaterial({ color: 0x88aacc, roughness: 0.3, metalness: 0.1 });
        const plate = new THREE.Mesh(plateGeo, plateMat);
        plate.position.y = -0.85;
        plate.receiveShadow = true;
        cakeGroup.add(plate);

        // ---- Cake layers ----
        const colors = [0x4a7a9c, 0x6a9ac7, 0x8ab8e0, 0xa8ccee];
        const yOffsets = [-0.5, -0.1, 0.3, 0.7];
        const radii = [1.3, 1.2, 1.0, 0.8];
        const heights = [0.35, 0.35, 0.35, 0.35];

        for (let i = 0; i < 4; i++) {
            const geo = new THREE.CylinderGeometry(radii[i], radii[i], heights[i], 32);
            const mat = new THREE.MeshStandardMaterial({
                color: colors[i],
                roughness: 0.6,
                metalness: 0.05,
                emissive: new THREE.Color(colors[i]).multiplyScalar(0.05)
            });
            const layer = new THREE.Mesh(geo, mat);
            layer.position.y = yOffsets[i];
            layer.castShadow = true;
            layer.receiveShadow = true;
            cakeGroup.add(layer);
        }

        // ---- Frosting (drips) ----
        // simple: a ring of small spheres around the top layer
        const frostingMat = new THREE.MeshStandardMaterial({ color: 0xbfd9ff, roughness: 0.4, emissive: new THREE.Color(0xbfd9ff).multiplyScalar(0.08) });
        const numDrips = 16;
        for (let i = 0; i < numDrips; i++) {
            const angle = (i / numDrips) * Math.PI * 2;
            const radius = 0.85;
            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;
            const drip = new THREE.Mesh(new THREE.SphereGeometry(0.08, 8, 8), frostingMat);
            drip.position.set(x, 0.75, z);
            cakeGroup.add(drip);
            // add a small drop below
            const drop = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), frostingMat);
            drop.position.set(x * 0.95, 0.6, z * 0.95);
            cakeGroup.add(drop);
        }

        // ---- Candles ----
        const candleMat = new THREE.MeshStandardMaterial({ color: 0xffdd88, emissive: new THREE.Color(0xffaa33).multiplyScalar(0.2) });
        const flameMat = new THREE.MeshStandardMaterial({ color: 0xff6600, emissive: new THREE.Color(0xff4400).multiplyScalar(0.5) });
        const candlePositions = [
            [-0.3, 0.95, 0.3],
            [0.3, 0.95, -0.3],
            [0, 0.95, -0.4],
            [-0.2, 0.95, -0.3],
            [0.2, 0.95, 0.4]
        ];
        candlePositions.forEach(pos => {
            const candle = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.25, 8), candleMat);
            candle.position.set(pos[0], pos[1], pos[2]);
            candle.castShadow = true;
            cakeGroup.add(candle);
            // flame
            const flame = new THREE.Mesh(new THREE.SphereGeometry(0.05, 6, 6), flameMat);
            flame.position.set(pos[0], pos[1] + 0.15, pos[2]);
            cakeGroup.add(flame);
            // tiny glow (point light would be heavy, use a sprite or emissive sphere)
        });

        // ---- Sparkle particles (floating around cake) ----
        const particleCount = 150;
        const particleGeo = new THREE.BufferGeometry();
        const particlePos = new Float32Array(particleCount * 3);
        for (let i = 0; i < particleCount * 3; i += 3) {
            const theta = Math.random() * Math.PI * 2;
            const phi = Math.random() * Math.PI;
            const r = 1.8 + Math.random() * 1.5;
            particlePos[i] = Math.sin(phi) * Math.cos(theta) * r;
            particlePos[i+1] = Math.sin(phi) * Math.sin(theta) * r * 0.6 + 0.2;
            particlePos[i+2] = Math.cos(phi) * r;
        }
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
        const particleMat = new THREE.PointsMaterial({
            color: 0x8ac4ff,
            size: 0.04,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending
        });
        const particles = new THREE.Points(particleGeo, particleMat);
        cakeGroup.add(particles);

        // ── Controls (drag to rotate) ──
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableZoom = false;
        controls.enablePan = false;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 1.8;
        controls.target.set(0, 0.2, 0);
        controls.update();

        // ── Resize ──
        function resize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
        }
        window.addEventListener('resize', resize);

        // ── Animation loop ──
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // autoRotate enabled

            // make particles float gently
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < positions.length; i += 3) {
                positions[i+1] += Math.sin(Date.now() * 0.001 + i) * 0.0005;
            }
            particles.geometry.attributes.position.needsUpdate = true;

            renderer.render(scene, camera);
        }
        animate();

        // ── Interactivity: click to toggle autoRotate ──
        canvas.addEventListener('click', () => {
            controls.autoRotate = !controls.autoRotate;
        });

        // ── Expose for button actions ──
        window.cakeControls = controls;

        // ── Button actions (reuse from previous, but with extra cake flare) ──
        document.getElementById('wishBtn').addEventListener('click', () => {
            // hearts burst
            for (let i = 0; i < 18; i++) {
                setTimeout(() => {
                    const heart = document.createElement('div');
                    heart.textContent = '💙';
                    heart.style.position = 'fixed';
                    heart.style.fontSize = (18 + Math.random() * 28) + 'px';
                    heart.style.left = (10 + Math.random() * 80) + '%';
                    heart.style.top = '-10%';
                    heart.style.pointerEvents = 'none';
                    heart.style.zIndex = '9999';
                    heart.style.opacity = '0.9';
                    heart.style.transition = 'all 2.8s cubic-bezier(0.2, 0.8, 0.3, 1)';
                    document.body.appendChild(heart);
                    requestAnimationFrame(() => {
                        heart.style.transform = `translateY(${90 + Math.random() * 40}vh) rotate(${Math.random() * 360}deg) scale(${0.6 + Math.random() * 0.8})`;
                        heart.style.opacity = '0';
                    });
                    setTimeout(() => heart.remove(), 3000);
                }, i * 70);
            }
            // pulse cake
            cakeGroup.scale.set(1.05, 1.05, 1.05);
            setTimeout(() => cakeGroup.scale.set(1, 1, 1), 300);
        });

        document.getElementById('surpriseBtn').addEventListener('click', () => {
            // sparkles
            const emojis = ['✨','🌟','💙','🎉','💎','⭐','🌊','🌀'];
            for (let i = 0; i < 28; i++) {
                setTimeout(() => {
                    const el = document.createElement('div');
                    el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
                    el.style.position = 'fixed';
                    el.style.fontSize = (16 + Math.random() * 30) + 'px';
                    el.style.left = (5 + Math.random() * 90) + '%';
                    el.style.top = (5 + Math.random() * 90) + '%';
                    el.style.pointerEvents = 'none';
                    el.style.zIndex = '9999';
                    el.style.opacity = '0.9';
                    el.style.transition = 'all 1.6s ease-out';
                    el.style.transform = 'scale(0) rotate(0deg)';
                    document.body.appendChild(el);
                    requestAnimationFrame(() => {
                        el.style.transform = `scale(${0.8 + Math.random() * 1.2}) rotate(${Math.random() * 720}deg)`;
                        el.style.opacity = '0';
                        el.style.top = (5 + Math.random() * 80) + '%';
                        el.style.left = (5 + Math.random() * 80) + '%';
                    });
                    setTimeout(() => el.remove(), 1800);
                }, i * 50);
            }
            // random message toast
            const msgs = ['You are my sunshine ☀️','Best boyfriend ever! 💙','So lucky to have you!','Today is YOUR day! 🎂','I love you Hursh! ❤️','Keep shining bright! ✨'];
            const msg = msgs[Math.floor(Math.random() * msgs.length)];
            const toast = document.createElement('div');
            toast.textContent = msg;
            toast.style.position = 'fixed';
            toast.style.bottom = '30px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%) scale(0.8)';
            toast.style.background = 'rgba(11,26,46,0.92)';
            toast.style.backdropFilter = 'blur(12px)';
            toast.style.border = '1px solid rgba(64,164,255,0.3)';
            toast.style.color = '#b0d4ff';
            toast.style.padding = '16px 32px';
            toast.style.borderRadius = '60px';
            toast.style.fontSize = '1.2rem';
            toast.style.fontWeight = '600';
            toast.style.boxShadow = '0 10px 50px rgba(0,0,0,0.5)';
            toast.style.zIndex = '10000';
            toast.style.transition = 'all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1)';
            toast.style.opacity = '0';
            toast.style.letterSpacing = '0.5px';
            toast.style.fontFamily = "'Inter', sans-serif";
            document.body.appendChild(toast);
            requestAnimationFrame(() => {
                toast.style.transform = 'translateX(-50%) scale(1)';
                toast.style.opacity = '1';
            });
            setTimeout(() => {
                toast.style.transform = 'translateX(-50%) scale(0.8)';
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 600);
            }, 3200);

            // flash cake
            cakeGroup.scale.set(1.1, 1.1, 1.1);
            setTimeout(() => cakeGroup.scale.set(1, 1, 1), 400);
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'h' || e.key === 'H') document.getElementById('wishBtn').click();
            if (e.key === 's' || e.key === 'S') document.getElementById('surpriseBtn').click();
        });

        console.log('%c💙 Happy Birthday Hursh! 💙', 'font-size:24px; font-weight:bold; color:#6ab7ff;');
        console.log('%c🎂 3D Cake with 5D sparkles!', 'font-size:16px; color:#b0d4ff;');

        // ── Fix initial resize ──
        setTimeout(resize, 100);
    })();
</script>
</body>
</html>
